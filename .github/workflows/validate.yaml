name: Validate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Go mod download
        run: go mod download

      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: --timeout=10m

      - name: Lint markdown
        uses: rvben/rumdl@1e0f1d13c87418c31e0d59dacddd98f27a02efcc # v0.3.2
        with:
          report-type: annotations

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      code-quality: write
      contents: read
      security-events: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Go mod download
        run: go mod download

      - name: Test
        id: test
        env:
          INPUT_MIN_COVERAGE: "60"
        run: |
          set -euo pipefail

          coverage_file="coverage.out"
          coverage_report_file="coverage.txt"
          cobertura_file="cobertura.xml"

          go install github.com/boumenot/gocover-cobertura@v1.5.0

          go test -v -covermode=atomic -coverprofile="${coverage_file}" ./...
          go tool cover -func="${coverage_file}" | tee "${coverage_report_file}"
          gocover-cobertura < "${coverage_file}" > "${cobertura_file}"

          coverage="$(grep -E 'total:.+' "${coverage_report_file}" | grep -Eo '[0-9]+\.[0-9]+')"
          coverage_ok="false"

          if (( $(echo "${coverage} >= ${INPUT_MIN_COVERAGE}" | bc -l) )); then
            coverage_ok="true"
          fi

          {
            echo "min_coverage=${INPUT_MIN_COVERAGE}"
            echo "coverage_file=${coverage_file}"
            echo "coverage_report_file=${coverage_report_file}"
            echo "cobertura_file=${cobertura_file}"
            echo "coverage=${coverage}"
            echo "coverage_ok=${coverage_ok}"
          } >> "${GITHUB_OUTPUT}"

          if [[ "${coverage_ok}" != "true" ]]; then
            echo "::error::coverage ${coverage}% is below required ${INPUT_MIN_COVERAGE}%"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          language: Go
          label: code-coverage
          file: ${{ steps.test.outputs.cobertura_file }}

      - name: Upload coverage artifact
        if: always() && steps.test.outputs.coverage_file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            ${{ steps.test.outputs.coverage_file }}
            ${{ steps.test.outputs.coverage_report_file }}
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: build --clean --snapshot

      - name: Get build metadata
        id: metadata
        env:
          INPUT_METADATA: ${{ steps.goreleaser.outputs.metadata }}
          INPUT_ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          set -euo pipefail

          project_name="$(jq --raw-output '.project_name' <<<"${INPUT_METADATA}")"
          version="$(jq --raw-output '.version' <<<"${INPUT_METADATA}")"

          output_dir="$(jq --raw-output '.[] | select(.type == "Metadata").path | split("/")[:-1] | join("/")' <<<"${INPUT_ARTIFACTS}")"
          checksums="$(jq --raw-output '.[] | select(.type == "Checksum").path' <<<"${INPUT_ARTIFACTS}")"

          {
            echo "name=${project_name}"
            echo "version=${version}"
            echo "output_dir=${output_dir}"
            echo "checksums=${checksums}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: ${{ steps.metadata.outputs.output_dir }}
          if-no-files-found: error
          retention-days: 7

    outputs:
      name: ${{ steps.metadata.outputs.name }}
      version: ${{ steps.metadata.outputs.version }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}

  docs:
    name: Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        shell: bash
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Get Hugo version
        id: hugo_version
        run: echo "version=$(yq --unwrapScalar '.module.hugoVersion.max // "latest"' ./hugo.yaml)" >> "${GITHUB_OUTPUT}"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ steps.hugo_version.outputs.version }}
          extended: true

      - name: Build with Hugo
        run: |
          hugo \
            --gc \
            --minify \
            --environment production \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

  check:
    name: Check
    if: always()
    needs:
      - lint
      - test
      - build
      - docs
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check
        env:
          INPUT_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          read -a results <<< "${INPUT_RESULTS}"
          for result in "${results[@]}"; do
            if [[ "${result}" == "failure" ]] || [[ "${result}" == "cancelled" ]]; then
              echo "::error::Workflow failed!"
              exit 1
            fi
          done
