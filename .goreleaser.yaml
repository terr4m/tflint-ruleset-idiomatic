version: 2

project_name: tflint-ruleset-idiomatic

snapshot:
  version_template: "{{ .Tag }}-dev"

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    binary: "{{ .ProjectName }}"

archives:
  - id: zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [zip]
    files:
      - none*

sboms:
  - id: default
    artifacts: archive

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: false
  use: github-native
